<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Francisca Luco — CV</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #fff;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    background: #fff;
    border-bottom: 0.5px solid rgba(0,0,0,0.1);
    z-index: 100;
  }
  nav a {
    font-size: 9px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #999;
    text-decoration: none;
    transition: color .2s;
  }
  nav a:hover { color: #111; }
  nav a.back::before { content: '← '; }

  .outer {
    position: fixed;
    top: 42px; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    padding: 20px 32px 20px 40px;
    gap: 0;
  }

  .cv-col {
    flex-shrink: 0;
    height: 100%;
    display: flex;
    align-items: center;
  }

  .cv-img {
    height: calc(100vh - 42px - 40px);
    max-height: 860px;
    width: auto;
    display: block;
    box-shadow: 0 2px 28px rgba(0,0,0,0.10);
  }

  .notes-col {
    flex: 1;
    position: relative;
    height: 100%;
    margin-left: 0;
  }

    <!-- NOTES -->

  <div class="notes-col">

    <!-- NOTE 1 -->

    <div class="note-block" id="n1">

      <div class="note-line"></div>

      <div class="note-circle">
        <div class="note-text">
          Interested in visual methods,
          platform aesthetics,
          and critical theory.
        </div>
      </div>

    </div>

    <!-- NOTE 2 -->

    <div class="note-block" id="n2">

      <div class="note-line"></div>

      <div class="note-circle">
        <div class="note-text">
          Research on AI,
          governance,
          subjectivity,
          and infrastructures.
        </div>
      </div>

    </div>

    <!-- NOTE 3 -->

    <div class="note-block" id="n3">

      <div class="note-line"></div>

      <div class="note-circle">
        <div class="note-text">
          Working between
          sociology,
          curatorial practice,
          and image production.
        </div>
      </div>

    </div>

    <!-- NOTE 4 -->

    <div class="note-block" id="n4">

      <div class="note-line"></div>

      <div class="note-circle">
        <div class="note-text">
          Based in Paris.
          Developing hybrid
          artistic and research work.
        </div>
      </div>

    </div>

  </div>

</div>

</body>
</html>
</body>
</html>
