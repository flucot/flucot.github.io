<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Francisca Luco — CV</title>
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #fff;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
  color: #111;
}

/* NAV */

nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  background: #fff;
  border-bottom: .5px solid rgba(0,0,0,.08);
  z-index: 100;
}
nav a {
  font-size: 9px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #999;
  text-decoration: none;
  transition: .2s ease;
}
nav a:hover { color: #111; }
nav a.back::before { content: '← '; }

/* GRID 3 COLUMNAS */

.outer {
  position: fixed;
  top: 42px; left: 0; right: 0; bottom: 0;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 28px 36px;
  gap: 0;
}

/* CV */

.cv-col {
  display: flex;
  align-items: center;
  justify-content: center;
}

.cv-wrap {
  width: min(32vw, 480px);
  height: calc(100vh - 110px);
  overflow: hidden;
  position: relative;
}

/* objeto PDF sin chrome */
.cv-wrap object {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* fallback: imagen si el PDF no carga */
.cv-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: top center;
  display: block;
}

/* COLUMNAS NOTAS */

.notes-left {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  align-items: flex-end;
  height: calc(100vh - 110px);
}

.notes-right {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  align-items: flex-start;
  height: calc(100vh - 110px);
}

/* NOTA: fila con brazo + bubble */

.note { display: flex; align-items: center; }
.note-left  { flex-direction: row; }   /* [bubble][arm→CV] */
.note-right { flex-direction: row; }   /* [CV←arm][bubble] */

/* BRAZO */

.arm {
  width: 48px;
  height: 1.5px;
  background: #111;
  flex-shrink: 0;
  position: relative;
}

/* punta de flecha izquierda: sale del CV, apunta hacia el bubble (←) */
.note-left .arm::before {
  content: '';
  position: absolute;
  left: -1px; top: -4px;
  width: 9px; height: 9px;
  border-bottom: 1.5px solid #111;
  border-left:  1.5px solid #111;
  transform: rotate(45deg);
}

/* punta de flecha derecha: sale del CV, apunta hacia el bubble (→) */
.note-right .arm::after {
  content: '';
  position: absolute;
  right: -1px; top: -4px;
  width: 9px; height: 9px;
  border-top:   1.5px solid #111;
  border-right: 1.5px solid #111;
  transform: rotate(45deg);
}

/* BUBBLE — la animación va aquí, no en .note */

.bubble {
  width: 185px;
  min-height: 140px;
  border: 1.15px solid rgba(0,0,0,.9);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 22px 18px;
  font-size: 15px;
  line-height: 1.45;
  letter-spacing: .04em;
  color: #111;
  flex-shrink: 0;
  will-change: transform;
}

.note-left  .bubble { border-radius: 52% 48% 49% 51% / 51% 49% 53% 47%; }
.note-right .bubble { border-radius: 48% 52% 51% 49% / 49% 53% 47% 51%; }

/* ANIMACIONES — aplicadas directo al bubble */

@keyframes fa {
  0%   { transform: translateY(0px)  rotate(0deg);    }
  100% { transform: translateY(-8px) rotate(-.4deg);  }
}
@keyframes fb {
  0%   { transform: translateY(0px)  rotate(0deg);   }
  100% { transform: translateY(-10px) rotate(.45deg); }
}
@keyframes fc {
  0%   { transform: translateY(0px)  rotate(0deg);   }
  100% { transform: translateY(-7px) rotate(-.25deg);}
}
@keyframes fd {
  0%   { transform: translateY(0px)  rotate(0deg);   }
  100% { transform: translateY(-9px) rotate(.3deg);  }
}

.ba { animation: fa 3.8s ease-in-out infinite alternate; }
.bb { animation: fb 4.4s ease-in-out infinite alternate; animation-delay: -1.1s; }
.bc { animation: fc 5.1s ease-in-out infinite alternate; animation-delay: -2.3s; }
.bd { animation: fd 4.0s ease-in-out infinite alternate; animation-delay: -0.6s; }

/* RESPONSIVE */

@media (max-width: 960px) {
  .arm { width: 28px; }
  .bubble { width: 145px; min-height: 115px; font-size: 13px; padding: 16px 12px; }
  .cv-wrap { width: min(40vw, 480px); }
}

@media (max-width: 680px) {
  .notes-left, .notes-right { display: none; }
  .outer { grid-template-columns: 1fr; justify-items: center; }
  .cv-wrap { width: 90vw; }
}

</style>
</head>
<body>

<nav>
  <a class="back" href="index.html">Portfolio</a>
  <a href="index.html">FL</a>
</nav>

<div class="outer">

  <!-- IZQUIERDA: [bubble][arm→] flecha apunta al bubble -->
  <div class="notes-left">

    <div class="note note-left">
      <div class="bubble ba">I'm based in Paris.</div>
      <div class="arm"></div>
    </div>

    <div class="note note-left">
      <div class="bubble bc">My practice spans AI, Latin America, and knowledge production.</div>
      <div class="arm"></div>
    </div>

  </div>

  <!-- CV AL CENTRO — object con fallback img -->
  <div class="cv-col">
    <div class="cv-wrap">
      <!--
        Cambia cv.pdf por la ruta real de tu archivo.
        Si el PDF no carga en el navegador, se muestra CV-preview.jpg como fallback.
      -->
      <object
        data="cv.pdf#toolbar=0&navpanes=0&scrollbar=0&statusbar=0&view=FitV"
        type="application/pdf"
      >
        <!-- fallback si el PDF no carga -->
        <img src="CV-preview.jpg" alt="CV Francisca Luco" />
      </object>
    </div>
  </div>

  <!-- DERECHA: [←arm][bubble] flecha apunta al bubble -->
  <div class="notes-right">

    <div class="note note-right">
      <div class="arm"></div>
      <div class="bubble bb">I have published a couple of papers, and now I'm doing my masters.</div>
    </div>

    <div class="note note-right">
      <div class="arm"></div>
      <div class="bubble bd">I was very interested in economics during my bachelor's.</div>
    </div>

  </div>

</div>

</body>
</html>
