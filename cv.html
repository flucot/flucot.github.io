<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Francisca Luco — CV</title>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #fff;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  overflow: hidden;
  height: 100vh;
  color: #111;
}

/* ---- NAV ---- */

nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  background: #fff;
  border-bottom: .5px solid rgba(0,0,0,.08);
  z-index: 100;
}

nav a {
  font-size: 9px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #999;
  text-decoration: none;
  transition: .2s ease;
}

nav a:hover { color: #111; }
nav a.back::before { content: '← '; }

/* ---- LAYOUT ---- */

.outer {
  position: fixed;
  top: 42px; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ---- CV AL CENTRO ---- */

.cv-col {
  position: relative;
  z-index: 2;
  width: min(34vw, 480px);
  flex-shrink: 0;
}

.cv-embed-wrap {
  width: 100%;
  height: calc(100vh - 90px);
  overflow: hidden;
  border-radius: 2px;
}

.cv-embed-wrap embed {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* ---- CAPA DE NOTAS (sobre todo) ---- */

.notes-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
}

/* ---- BLOQUE DE NOTA ---- */

.note {
  position: absolute;
  display: flex;
  align-items: center;
}

/*
  LEFT: bubble a la izquierda, brazo a la derecha (hacia el CV).
  Flecha en el extremo izquierdo del brazo → apunta hacia el bubble (←).
  DOM: [bubble][arm]
*/
.note.left {
  left: 0;
  flex-direction: row;
}

/*
  RIGHT: brazo a la izquierda (hacia el CV), bubble a la derecha.
  Flecha en el extremo derecho del brazo → apunta hacia el bubble (→).
  DOM: [arm][bubble]
*/
.note.right {
  right: 0;
  flex-direction: row;
}

/* ---- BRAZO ---- */

.note-arm {
  width: 90px;
  height: 1.5px;
  background: #111;
  flex-shrink: 0;
  position: relative;
}

/* Flecha izquierda: punta en el extremo izquierdo del brazo (← hacia bubble) */
.note.left .note-arm::before {
  content: '';
  position: absolute;
  left: -1px;
  top: -4px;
  width: 9px;
  height: 9px;
  border-bottom: 1.5px solid #111;
  border-left: 1.5px solid #111;
  transform: rotate(45deg);
}

/* Flecha derecha: punta en el extremo derecho del brazo (→ hacia bubble) */
.note.right .note-arm::after {
  content: '';
  position: absolute;
  right: -1px;
  top: -4px;
  width: 9px;
  height: 9px;
  border-top: 1.5px solid #111;
  border-right: 1.5px solid #111;
  transform: rotate(45deg);
}

/* ---- BUBBLE ORGÁNICO ---- */

.note-bubble {
  width: 200px;
  min-height: 150px;
  border: 1.15px solid rgba(0,0,0,.92);
  border-radius: 52% 48% 49% 51% / 51% 49% 53% 47%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 22px 18px;
  font-size: 15px;
  line-height: 1.45;
  letter-spacing: .04em;
  color: #111;
  flex-shrink: 0;
}

/* ---- ANIMACIONES ---- */

@keyframes floatA {
  0%   { transform: translateY(0px) rotate(0deg); }
  100% { transform: translateY(-7px) rotate(-.4deg); }
}
@keyframes floatB {
  0%   { transform: translateY(0px) rotate(0deg); }
  100% { transform: translateY(-9px) rotate(.45deg); }
}
@keyframes floatC {
  0%   { transform: translateY(0px) rotate(0deg); }
  100% { transform: translateY(-6px) rotate(-.25deg); }
}
@keyframes floatD {
  0%   { transform: translateY(0px) rotate(0deg); }
  100% { transform: translateY(-8px) rotate(.3deg); }
}

#n1 { top: 8%;  animation: floatA 3.8s ease-in-out infinite alternate; }
#n2 { top: 28%; animation: floatB 4.4s ease-in-out infinite alternate; animation-delay: -.9s; }
#n3 { top: 52%; animation: floatC 5.0s ease-in-out infinite alternate; animation-delay: -2.1s; }
#n4 { top: 72%; animation: floatD 4.1s ease-in-out infinite alternate; animation-delay: -.5s; }

/* ---- RESPONSIVE ---- */

@media (max-width: 1100px) {
  .cv-col { width: min(44vw, 500px); }
  .note-arm { width: 60px; }
  .note-bubble { width: 160px; min-height: 120px; font-size: 13px; padding: 18px 14px; }
}

@media (max-width: 800px) {
  .notes-layer { display: none; }
  .cv-col { width: min(88vw, 600px); }
}

</style>
</head>

<body>

<nav>
  <a class="back" href="index.html">Portfolio</a>
  <a href="index.html">FL</a>
</nav>

<div class="outer">

  <!-- CV CENTRADO -->
  <div class="cv-col">
    <div class="cv-embed-wrap">
      <!-- cambia cv.pdf por tu archivo -->
      <embed
        src="cv.pdf#toolbar=0&navpanes=0&scrollbar=0&statusbar=0&view=FitH"
        type="application/pdf"
      />
    </div>
  </div>

  <!-- NOTAS -->
  <div class="notes-layer">

    <!-- N1: izquierda — [bubble][←arm] -->
    <div class="note left" id="n1">
      <div class="note-bubble">I'm based in Paris.</div>
      <div class="note-arm"></div>
    </div>

    <!-- N2: derecha — [arm→][bubble] -->
    <div class="note right" id="n2">
      <div class="note-arm"></div>
      <div class="note-bubble">I have published a couple of papers, and now I'm doing my masters.</div>
    </div>

    <!-- N3: izquierda — [bubble][←arm] -->
    <div class="note left" id="n3">
      <div class="note-bubble">My practice spans AI, Latin America, and knowledge production.</div>
      <div class="note-arm"></div>
    </div>

    <!-- N4: derecha — [arm→][bubble] -->
    <div class="note right" id="n4">
      <div class="note-arm"></div>
      <div class="note-bubble">I was very interested in economics during my bachelor's.</div>
    </div>

  </div>

</div>

</body>
</html>
