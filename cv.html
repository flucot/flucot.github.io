<title>Francisca Luco — CV</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #fff;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    background: #fff;
    border-bottom: 0.5px solid rgba(0,0,0,0.1);
    z-index: 100;
  }
  nav a {
    font-size: 9px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #999;
    text-decoration: none;
    transition: color .2s;
  }
  nav a:hover { color: #111; }
  nav a.back::before { content: '← '; }

  .outer {
    position: fixed;
    top: 42px; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    padding: 20px 32px 20px 40px;
    gap: 0;
  }

  .cv-col {
    flex-shrink: 0;
    height: 100%;
    display: flex;
    align-items: center;
  }

  .cv-img {
    height: calc(100vh - 42px - 40px);
    max-height: 860px;
    width: auto;
    display: block;
    box-shadow: 0 2px 28px rgba(0,0,0,0.10);
  }

  .notes-col {
    flex: 1;
    position: relative;
    height: 100%;
    margin-left: 0;
  }

  /* Floating note = circle + label */
  .note-block {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 0;
    pointer-events: none;
  }

  /* The animated SVG arrow */
  .note-block svg.arrow {
    flex-shrink: 0;
    overflow: visible;
  }

  /* Circle enclosing the note text */
  .note-circle {
    border: 1px solid #111;
    border-radius: 50%;
    width: 130px;
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 14px;
    flex-shrink: 0;
    animation-name: floatCircle;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-direction: alternate;
  }

  .note-text {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 9.5px;
    font-weight: 400;
    letter-spacing: .04em;
    color: #111;
    line-height: 1.5;
  }

  @keyframes floatCircle {
    0%   { transform: translateY(0px); }
    100% { transform: translateY(-6px); }
  }

  /* Each circle gets a different duration so they drift independently */
  #n1 .note-circle { animation-duration: 3.4s; animation-delay: 0s; }
  #n2 .note-circle { animation-duration: 4.1s; animation-delay: -1.2s; }
  #n3 .note-circle { animation-duration: 3.7s; animation-delay: -0.6s; }
  #n4 .note-circle { animation-duration: 4.5s; animation-delay: -2.0s; }

  /* Arrow paths also drift slightly */
  .arrow-path {
    animation: floatArrow ease-in-out infinite alternate;
  }
  #n1 .arrow-path { animation-duration: 3.4s; animation-delay: 0s; }
  #n2 .arrow-path { animation-duration: 4.1s; animation-delay: -1.2s; }
  #n3 .arrow-path { animation-duration: 3.7s; animation-delay: -0.6s; }
  #n4 .arrow-path { animation-duration: 4.5s; animation-delay: -2.0s; }

  @keyframes floatArrow {
    0%   { transform: translateY(0px); }
    100% { transform: translateY(-6px); }
  }
</style>
</head>

    <!-- Note 3: Venice Biennale -->
    <div class="note-block" id="n3">
      <svg class="arrow" id="svg3" style="overflow:visible; display:block;"></svg>
      <div class="note-circle">
        <span class="note-text">My little curatorial moment — another way of communicating (and creating) knowledge.</span>
      </div>
    </div>

    <!-- Note 4: Directorate / economics -->
    <div class="note-block" id="n4">
      <svg class="arrow" id="svg4" style="overflow:visible; display:block;"></svg>
      <div class="note-circle">
        <span class="note-text">During bachelors I had a strong passion for economics.</span>
      </div>
    </div>

  </div>
</div>

<script>
  // Vertical positions in the CV image (fraction of image height)
  const cvPositions = [0.175, 0.36, 0.535, 0.715];
  const noteIds     = ['n1','n2','n3','n4'];
  const svgIds      = ['svg1','svg2','svg3','svg4'];

  function buildArrow(svgEl, x1, y1, x2, y2) {
    // Organic cubic bezier: control points offset for a natural curve
    const mx = (x1 + x2) / 2;
    const my = (y1 + y2) / 2;
    const cx1 = x1 + (x2 - x1) * 0.3;
    const cy1 = y1 - 18;
    const cx2 = x1 + (x2 - x1) * 0.7;
    const cy2 = y2 + 12;

    // Arrow head direction at end point
    const dx = x2 - cx2;
    const dy = y2 - cy2;
    const len = Math.sqrt(dx*dx + dy*dy);
    const nx = dx/len, ny = dy/len;
    const aw = 9;
    const px = -ny * aw, py = nx * aw;

    const d = `M ${x1} ${y1} C ${cx1} ${cy1} ${cx2} ${cy2} ${x2} ${y2}`;

    svgEl.innerHTML = `
      <path class="arrow-path" d="${d}" stroke="#c0392b" stroke-width="2.8"
            fill="none" stroke-linecap="round"/>
      <polygon class="arrow-path"
        points="${x2 + px},${y2 + py} ${x2 - px},${y2 - py} ${x2 + nx*14},${y2 + ny*14}"
        fill="#c0392b"/>
    `;
  }

  function layout() {
    const img     = document.getElementById('cvimg');
    const col     = document.getElementById('notesCol');
    const colRect = col.getBoundingClientRect();
    const imgRect = img.getBoundingClientRect();

    noteIds.forEach((id, i) => {
      const block = document.getElementById(id);
      const svgEl = document.getElementById(svgIds[i]);
      const circle = block.querySelector('.note-circle');

      // Target Y on screen = image top + fraction * image height
      const targetY = imgRect.top + imgRect.height * cvPositions[i];

      // Circle Y relative to col
      const circleY = targetY - colRect.top - 65; // 65 = half circle height
      block.style.top  = Math.max(10, circleY) + 'px';
      block.style.left = '10px';

      // Arrow: from left edge of col to the CV image right edge
      // Arrow tip points LEFT into the CV
      const blockRect  = block.getBoundingClientRect();
      const circleMidY = blockRect.top + 65 - colRect.top; // mid of circle in col coords

      // x2, y2 = tip of arrow (at the CV image boundary)
      const x2 = 0;   // left edge of notes col = right edge of cv image  
      const y2 = circleMidY;

      // x1, y1 = start of arrow (right side of circle)
      const x1 = 148; // circle width (130) + small gap
      const y1 = circleMidY;

      svgEl.style.position = 'absolute';
      svgEl.style.left = '0';
      svgEl.style.top  = '0';
      svgEl.setAttribute('width',  colRect.width);
      svgEl.setAttribute('height', colRect.height);
      svgEl.style.width  = colRect.width  + 'px';
      svgEl.style.height = colRect.height + 'px';

      buildArrow(svgEl, x1, y1, x2, y2);
    });
  }

  const img = document.getElementById('cvimg');
  if (img.complete) layout();
  else img.addEventListener('load', layout);
  window.addEventListener('resize', layout);
</script>

</body>
</html>
