<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Francisca Luco — CV</title>
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #fff;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
  color: #111;
}

nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  background: #fff;
  border-bottom: .5px solid rgba(0,0,0,.08);
  z-index: 100;
}

nav a {
  font-size: 9px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #999;
  text-decoration: none;
  transition: .2s ease;
}

nav a:hover { color: #111; }
nav a.back::before { content: '← '; }

/* ---- 3-COLUMN LAYOUT ---- */

.outer {
  position: fixed;
  top: 42px; left: 0; right: 0; bottom: 0;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 24px 40px;
}

/* ---- CV CENTRADO ---- */

.cv-col {
  display: flex;
  align-items: center;
  justify-content: center;
}

.cv-embed-wrap {
  width: min(36vw, 520px);
  height: calc(100vh - 110px);
  overflow: hidden;
}

.cv-embed-wrap embed {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* ---- COLUMNAS DE NOTAS ---- */

.notes-left {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  align-items: flex-end;
  height: calc(100vh - 110px);
}

.notes-right {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  align-items: flex-start;
  height: calc(100vh - 110px);
}

/* ---- NOTA ---- */

.note { display: flex; align-items: center; }
.note-left  { flex-direction: row; }
.note-right { flex-direction: row; }

/* ---- BRAZO ---- */

.arm {
  width: 50px;
  height: 1.5px;
  background: #111;
  flex-shrink: 0;
  position: relative;
}

/* Flecha izquierda: punta en extremo izquierdo, apunta hacia el bubble */
.note-left .arm::before {
  content: '';
  position: absolute;
  left: -1px; top: -4px;
  width: 9px; height: 9px;
  border-bottom: 1.5px solid #111;
  border-left: 1.5px solid #111;
  transform: rotate(45deg);
}

/* Flecha derecha: punta en extremo derecho, apunta hacia el bubble */
.note-right .arm::after {
  content: '';
  position: absolute;
  right: -1px; top: -4px;
  width: 9px; height: 9px;
  border-top: 1.5px solid #111;
  border-right: 1.5px solid #111;
  transform: rotate(45deg);
}

/* ---- BUBBLE ORGÁNICO ---- */

.bubble {
  width: 190px;
  min-height: 140px;
  border: 1.15px solid rgba(0,0,0,.92);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 22px 18px;
  font-size: 15px;
  line-height: 1.45;
  letter-spacing: .04em;
  color: #111;
  flex-shrink: 0;
}

.note-left  .bubble { border-radius: 52% 48% 49% 51% / 51% 49% 53% 47%; }
.note-right .bubble { border-radius: 48% 52% 51% 49% / 49% 53% 47% 51%; }

/* ---- ANIMACIONES ---- */

@keyframes fa { 0% { transform: translateY(0px) rotate(0deg); } 100% { transform: translateY(-7px) rotate(-.35deg); } }
@keyframes fb { 0% { transform: translateY(0px) rotate(0deg); } 100% { transform: translateY(-9px) rotate(.4deg);  } }
@keyframes fc { 0% { transform: translateY(0px) rotate(0deg); } 100% { transform: translateY(-6px) rotate(-.2deg); } }
@keyframes fd { 0% { transform: translateY(0px) rotate(0deg); } 100% { transform: translateY(-8px) rotate(.3deg);  } }

.na { animation: fa 3.8s ease-in-out infinite alternate; }
.nb { animation: fb 4.4s ease-in-out infinite alternate; animation-delay: -.9s;  }
.nc { animation: fc 5.0s ease-in-out infinite alternate; animation-delay: -2.1s; }
.nd { animation: fd 4.1s ease-in-out infinite alternate; animation-delay: -.5s;  }

/* ---- RESPONSIVE ---- */

@media (max-width: 1000px) {
  .outer { padding: 16px 20px; }
  .arm { width: 30px; }
  .bubble { width: 140px; min-height: 110px; font-size: 13px; padding: 16px 12px; }
}

@media (max-width: 700px) {
  .outer { grid-template-columns: 1fr; justify-items: center; }
  .notes-left, .notes-right { display: none; }
  .cv-embed-wrap { width: 90vw; }
}

</style>
</head>
<body>

<nav>
  <a class="back" href="index.html">Portfolio</a>
  <a href="index.html">FL</a>
</nav>

<div class="outer">

  <!-- NOTAS IZQUIERDA: [bubble][arm] — flecha apunta izquierda hacia el bubble -->
  <div class="notes-left">

    <div class="note note-left na">
      <div class="bubble">I'm based in Paris.</div>
      <div class="arm"></div>
    </div>

    <div class="note note-left nc">
      <div class="bubble">My practice spans AI, Latin America, and knowledge production.</div>
      <div class="arm"></div>
    </div>

  </div>

  <!-- CV AL CENTRO -->
  <div class="cv-col">
    <div class="cv-embed-wrap">
      <!-- cambia cv.pdf por tu archivo -->
      <embed
        src="cv.pdf#toolbar=0&navpanes=0&scrollbar=0&statusbar=0&view=FitH"
        type="application/pdf"
      />
    </div>
  </div>

  <!-- NOTAS DERECHA: [arm][bubble] — flecha apunta derecha hacia el bubble -->
  <div class="notes-right">

    <div class="note note-right nb">
      <div class="arm"></div>
      <div class="bubble">I have published a couple of papers, and now I'm doing my masters.</div>
    </div>

    <div class="note note-right nd">
      <div class="arm"></div>
      <div class="bubble">I was very interested in economics during my bachelor's.</div>
    </div>

  </div>

</div>

</body>
</html>
