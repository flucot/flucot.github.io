<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Francisca Luco — CV</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#fff;
  font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
  overflow:hidden;
  height:100vh;
  color:#111;
}

/* ---------------- NAV ---------------- */

nav{
  position:fixed;
  top:0;
  left:0;
  right:0;

  height:42px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 28px;

  background:#fff;

  border-bottom:.5px solid rgba(0,0,0,.08);

  z-index:100;
}

nav a{
  font-size:9px;
  letter-spacing:.14em;
  text-transform:uppercase;

  color:#999;
  text-decoration:none;

  transition:.2s ease;
}

nav a:hover{
  color:#111;
}

nav a.back::before{
  content:'← ';
}

/* ---------------- MAIN ---------------- */

.outer{
  position:fixed;

  top:42px;
  left:0;
  right:0;
  bottom:0;

  display:flex;
  align-items:center;

  padding:18px 36px 18px 42px;
}

/* ---------------- PDF ---------------- */

.cv-col{
  position:relative;

  width:52vw;
  height:100%;

  display:flex;
  align-items:center;
}

.cv-frame{
  width:100%;
  height:calc(100vh - 78px);

  border:none;

  box-shadow:
    0 2px 20px rgba(0,0,0,.05),
    0 8px 40px rgba(0,0,0,.04);
}

/* ---------------- NOTES ---------------- */

.notes-col{
  position:relative;

  flex:1;
  height:100%;
}

/* ---------------- NODE SYSTEM ---------------- */

.note-block{
  position:absolute;

  display:flex;
  align-items:center;

  pointer-events:none;
}

/* ---------------- STRAIGHT FLOATING LINES ---------------- */

.note-line{
  width:170px;
  height:1.5px;

  background:#111;

  opacity:.9;

  transform-origin:left center;

  animation-name:floatLine;
  animation-timing-function:ease-in-out;
  animation-iteration-count:infinite;
  animation-direction:alternate;
}

.note-line::after{
  content:'';

  position:absolute;
  right:-2px;
  top:-3px;

  width:10px;
  height:10px;

  border-top:1.5px solid #111;
  border-right:1.5px solid #111;

  transform:rotate(45deg);
}

/* independent motion */

#n1 .note-line{
  animation-duration:3.7s;
  animation-delay:0s;
}

#n2 .note-line{
  animation-duration:4.4s;
  animation-delay:-1.2s;
}

#n3 .note-line{
  animation-duration:5.1s;
  animation-delay:-2s;
}

#n4 .note-line{
  animation-duration:4s;
  animation-delay:-0.6s;
}

@keyframes floatLine{
  0%{
    transform:
      translateX(0px)
      translateY(0px)
      rotate(0deg);
  }

  100%{
    transform:
      translateX(-5px)
      translateY(-4px)
      rotate(-0.3deg);
  }
}

/* ---------------- ORGANIC COMMENTS ---------------- */

.note-circle{
  position:relative;

  width:132px;
  height:132px;

  margin-left:18px;

  border:1.15px solid rgba(0,0,0,.92);

  border-radius:
    52% 48% 49% 51% /
    51% 49% 53% 47%;

  background:
    rgba(255,255,255,.82);

  backdrop-filter:blur(2px);

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:16px;

  animation-name:floatCircle;
  animation-timing-function:ease-in-out;
  animation-iteration-count:infinite;
  animation-direction:alternate;
}

/* each node floats differently */

#n1 .note-circle{
  animation-duration:3.4s;
  animation-delay:0s;
}

#n2 .note-circle{
  animation-duration:4.1s;
  animation-delay:-1.1s;
}

#n3 .note-circle{
  animation-duration:4.7s;
  animation-delay:-2.1s;
}

#n4 .note-circle{
  animation-duration:3.8s;
  animation-delay:-0.8s;
}

@keyframes floatCircle{
  0%{
    transform:
      translateY(0px)
      rotate(0deg);
  }

  100%{
    transform:
      translateY(-7px)
      rotate(-0.45deg);
  }
}

/* ---------------- TEXT ---------------- */

.note-text{
  font-size:9.4px;
  line-height:1.55;

  letter-spacing:.04em;

  animation:textFloat 5s ease-in-out infinite alternate;
}

@keyframes textFloat{
  0%{
    transform:translateY(0px);
  }

  100%{
    transform:translateY(-1.5px);
  }
}

/* ---------------- POSITIONS ---------------- */

#n1{
  top:10%;
  left:2%;
}

#n2{
  top:34%;
  left:7%;
}

#n3{
  top:59%;
  left:0%;
}

#n4{
  top:80%;
  left:8%;
}

</style>
</head>

<body>

<nav>
  <a class="back" href="index.html">Portfolio</a>
  <a href="index.html">FL</a>
</nav>

<div class="outer">

  <!-- PDF -->

  <div class="cv-col">

    <!-- cambia cv.pdf por tu archivo -->

    <iframe
      class="cv-frame"
      src="cv.pdf"
    ></iframe>

  </div>

  <!-- NOTES -->

  <div class="notes-col">

    <!-- NOTE 1 -->

    <div class="note-block" id="n1">

      <div class="note-line"></div>

      <div class="note-circle">
        <div class="note-text">
          Interested in visual methods,
          platform aesthetics,
          and critical theory.
        </div>
      </div>

    </div>

    <!-- NOTE 2 -->

    <div class="note-block" id="n2">

      <div class="note-line"></div>

      <div class="note-circle">
        <div class="note-text">
          Research on AI,
          governance,
          subjectivity,
          and infrastructures.
        </div>
      </div>

    </div>

    <!-- NOTE 3 -->

    <div class="note-block" id="n3">

      <div class="note-line"></div>

      <div class="note-circle">
        <div class="note-text">
          Working between
          sociology,
          curatorial practice,
          and image production.
        </div>
      </div>

    </div>

    <!-- NOTE 4 -->

    <div class="note-block" id="n4">

      <div class="note-line"></div>

      <div class="note-circle">
        <div class="note-text">
          Based in Paris.
          Developing hybrid
          artistic and research work.
        </div>
      </div>

    </div>

  </div>

</div>

</body>
</html>
