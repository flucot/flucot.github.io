<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Francisca Luco — CV</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#fff;
  font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
  overflow:hidden;
  height:100vh;
  color:#111;
}

/* ---------------- NAV ---------------- */

nav{
  position:fixed;
  top:0;
  left:0;
  right:0;

  height:42px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 28px;

  background:#fff;

  border-bottom:.5px solid rgba(0,0,0,.08);

  z-index:100;
}

nav a{
  font-size:9px;
  letter-spacing:.14em;
  text-transform:uppercase;

  color:#999;
  text-decoration:none;

  transition:.2s ease;
}

nav a:hover{
  color:#111;
}

nav a.back::before{
  content:'← ';
}

/* ---------------- MAIN ---------------- */

.outer{
  position:fixed;

  top:42px;
  left:0;
  right:0;
  bottom:0;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:16px 40px;
}

/* ---------------- PDF ---------------- */

.cv-col{
  position:relative;

  width:min(42vw, 620px);
  height:100%;

  display:flex;
  align-items:center;
}

.cv-frame{
  width:100%;
  height:calc(100vh - 110px);

  border:none;

  box-shadow:
    0 2px 20px rgba(0,0,0,.05),
    0 8px 40px rgba(0,0,0,.04);
}

/* ---------------- NOTES ---------------- */

.notes-col{
  position:absolute;
  inset:0;
  height:100%;
}

/* ---------------- NODE SYSTEM ---------------- */

.note-block{
  position:absolute;

  display:flex;
  align-items:center;

  pointer-events:none;
}

.note-block.left{
  left:calc(50% - 560px);
}

.note-block.right{
  right:calc(50% - 560px);
}

.note-block.right .note-line{
  transform-origin:right center;
}

.note-block.right .note-line::after{
  right:auto;
  left:-2px;

  border-top:none;
  border-right:none;
  border-bottom:1.5px solid #111;
  border-left:1.5px solid #111;
}

.note-block.right .note-circle{
  margin-left:0;
  margin-right:18px;
}

.note-block.right{
  flex-direction:row-reverse;
}

/* ---------------- STRAIGHT FLOATING LINES ---------------- */

.note-line{
  width:170px;
  height:1.5px;

  background:#111;

  opacity:.9;

  transform-origin:left center;

  animation-name:floatLine;
  animation-timing-function:ease-in-out;
  animation-iteration-count:infinite;
  animation-direction:alternate;
}

.note-line::after{
  content:'';

  position:absolute;
  right:-2px;
  top:-3px;

  width:10px;
  height:10px;

  border-top:1.5px solid #111;
  border-right:1.5px solid #111;

  transform:rotate(45deg);
}

/* independent motion */

#n1 .note-line{
  animation-duration:3.7s;
  animation-delay:0s;
}

#n2 .note-line{
  animation-duration:4.4s;
  animation-delay:-1.2s;
}

#n3 .note-line{
  animation-duration:5.1s;
  animation-delay:-2s;
}

#n4 .note-line{
  animation-duration:4s;
  animation-delay:-0.6s;
}

@keyframes floatLine{
  0%{
    transform:
      translateX(0px)
      translateY(0px)
      rotate(0deg);
  }

  100%{
    transform:
      translateX(-5px)
      translateY(-4px)
      rotate(-0.3deg);
  }
}

/* ---------------- ORGANIC COMMENTS ---------------- */

.note-circle{
  position:relative;

  width:210px;
  min-height:170px;

  margin-left:18px;

  border:1.15px solid rgba(0,0,0,.92);

  border-radius:
    52% 48% 49% 51% /
    51% 49% 53% 47%;

  background:
    rgba(255,255,255,.82);

  backdrop-filter:blur(2px);

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:20px;

  animation-name:floatCircle;
  animation-timing-function:ease-in-out;
  animation-iteration-count:infinite;
  animation-direction:alternate;
}

/* each node floats differently */

#n1 .note-circle{
  animation-duration:3.4s;
  animation-delay:0s;
}

#n2 .note-circle{
  animation-duration:4.1s;
  animation-delay:-1.1s;
}

#n3 .note-circle{
  animation-duration:4.7s;
  animation-delay:-2.1s;
}

#n4 .note-circle{
  animation-duration:3.8s;
  animation-delay:-0.8s;
}

@keyframes floatCircle{
  0%{
    transform:
      translateY(0px)
      rotate(0deg);
  }

  100%{
    transform:
      translateY(-7px)
      rotate(-0.45deg);
  }
}

/* ---------------- TEXT ---------------- */

.note-text{
  font-size:16px;
  line-height:1.45;

  letter-spacing:.04em;

  animation:textFloat 5s ease-in-out infinite alternate;
}

@keyframes textFloat{
  0%{
    transform:translateY(0px);
  }

  100%{
    transform:translateY(-1.5px);
  }
}

/* ---------------- POSITIONS ---------------- */

#n1{
  top:10%;
}

#n2{
  top:30%;
}

#n3{
  top:53%;
}

#n4{
  top:74%;
}

@media (max-width: 1200px){
  .cv-col{
    width:min(52vw, 640px);
  }

  .note-block.left{
    left:2%;
  }

  .note-block.right{
    right:2%;
  }

  .note-line{
    width:120px;
  }

  .note-circle{
    width:170px;
    min-height:140px;
    padding:16px;
  }

  .note-text{
    font-size:13px;
  }
}

@media (max-width: 900px){
  .notes-col{
    display:none;
  }

  .cv-col{
    width:min(92vw, 760px);
  }

  .cv-frame{
    height:calc(100vh - 76px);
  }
}

</style>
</head>

<body>

<nav>
  <a class="back" href="index.html">Portfolio</a>
  <a href="index.html">FL</a>
</nav>

<div class="outer">

  <!-- PDF -->

  <div class="cv-col">

    <!-- cambia cv.pdf por tu archivo -->

    <iframe
      class="cv-frame"
      src="CV.pdf#view=FitH"
    ></iframe>

  </div>

  <!-- NOTES -->

  <div class="notes-col">

    <!-- NOTE 1 -->

    <div class="note-block left" id="n1">

      <div class="note-line"></div>

      <div class="note-circle">
        <div class="note-text">
          I'm based in Paris.
        </div>
      </div>

    </div>

    <!-- NOTE 2 -->

    <div class="note-block right" id="n2">

      <div class="note-line"></div>

      <div class="note-circle">
        <div class="note-text">
          I have publish a
          couple of papers,
          and now i'm doing my 
          masters.
        </div>
      </div>

    </div>

    <!-- NOTE 3 -->

    <div class="note-block left" id="n3">

      <div class="note-line"></div>

      <div class="note-circle">
        <div class="note-text">
          My practice spans between
          AI, latin-america,
          and knowledge production.
        </div>
      </div>

    </div>

    <!-- NOTE 4 -->

    <div class="note-block right" id="n4">

      <div class="note-line"></div>

      <div class="note-circle">
        <div class="note-text">
          I was very interested in
          economics during my bachelor's
          and shortly after it.
        </div>
      </div>

    </div>

  </div>

</div>

</body>
</html>
